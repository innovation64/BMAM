name: Memory System Regression Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  memory-system-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Cross-Session Long-Term Memory Test
      id: cross_session
      run: |
        echo "::group::Cross-Session Test"
        python3 tests/test_cross_session_long_memory.py
        echo "::endgroup::"
      continue-on-error: false

    - name: Run Long-Term Retrieval Quality Evaluation
      id: quality_eval
      run: |
        echo "::group::Quality Evaluation"
        python3 tests/test_long_term_retrieval_quality.py
        echo "::endgroup::"
      continue-on-error: true  # Allow moderate failures

    - name: Run Environment/Exploration Writeback Test
      id: env_test
      run: |
        echo "::group::Environment Writeback"
        python3 tests/test_environment_exploration_writeback.py
        echo "::endgroup::"
      continue-on-error: true

    - name: Verify Metrics Output
      run: |
        echo "::group::Metrics Verification"
        ls -lh metrics/cross_session/
        cat metrics/cross_session/session2_state.json | python3 -m json.tool
        echo "::endgroup::"

    - name: Check Long-Term Retrieval Threshold
      run: |
        echo "::group::Threshold Check"
        python3 << 'EOF'
        import json
        from pathlib import Path

        # Check Session 2 results
        session2_file = Path("metrics/cross_session/session2_state.json")
        if session2_file.exists():
            with open(session2_file) as f:
                data = json.load(f)

            long_term_pct = data['retrieval_stats']['long_term_percentage']
            print(f"Long-term retrieval: {long_term_pct:.1f}%")

            # CRITICAL THRESHOLD: Must be >= 70%
            if long_term_pct < 70:
                print(f"❌ FAIL: Long-term retrieval {long_term_pct:.1f}% < 70% threshold")
                print("This indicates MemorySystem retrieval path is broken!")
                exit(1)
            else:
                print(f"✅ PASS: Long-term retrieval {long_term_pct:.1f}% >= 70%")
        else:
            print("⚠️ WARNING: Session 2 state file not found")
            exit(1)
        EOF
        echo "::endgroup::"

    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: memory-system-test-results
        path: |
          metrics/cross_session/*.json
          metrics/*.json
          *.log
        retention-days: 30

    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          let comment = '## ❌ Memory System Regression Test Failed\n\n';

          // Try to read Session 2 results
          try {
            const session2 = JSON.parse(fs.readFileSync('metrics/cross_session/session2_state.json', 'utf8'));
            const longTermPct = session2.retrieval_stats.long_term_percentage;

            comment += `**Long-term Retrieval**: ${longTermPct.toFixed(1)}% (threshold: ≥70%)\n\n`;

            if (longTermPct < 70) {
              comment += '### ⚠️ Critical Issue: MemorySystem Retrieval Path Broken\n\n';
              comment += 'This PR may have introduced changes that prevent long-term memory retrieval.\n\n';
              comment += '**Possible causes**:\n';
              comment += '- MemoryCoordinator not receiving memory_system reference\n';
              comment += '- smart_retrieve() not querying MemorySystem\n';
              comment += '- MemorySystem API changes breaking compatibility\n\n';
              comment += '**Action required**: Review changes to memory retrieval paths.\n';
            }
          } catch (e) {
            comment += `Error reading test results: ${e.message}\n`;
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Summary
      if: always()
      run: |
        echo "## Memory System Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Cross-Session: ${{ steps.cross_session.outcome }}" >> $GITHUB_STEP_SUMMARY
        echo "- Quality Eval: ${{ steps.quality_eval.outcome }}" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ steps.env_test.outcome }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Critical Threshold" >> $GITHUB_STEP_SUMMARY
        echo "Long-term retrieval must be ≥70% to ensure MemorySystem is working" >> $GITHUB_STEP_SUMMARY
