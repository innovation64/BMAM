name: Memory System Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # 允许手动触发
  workflow_dispatch:

jobs:
  memory-system-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        pip install -r requirements.txt || echo "No requirements.txt found"
        pip install openai faiss-cpu scikit-learn numpy

    - name: Run fast tests (pytest)
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest tests/test_memory_system_suite.py -v -m "not slow" --tb=short
      continue-on-error: false

    - name: Run slow tests (LoCoMo benchmark)
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest tests/test_memory_system_suite.py -v -m "slow" --tb=short
      continue-on-error: true

    - name: Run standalone assertion tests
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python test_reasoning_chain_assertions.py || echo "Assertion tests completed with warnings"
      continue-on-error: true

    - name: Run KG observability test
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python test_kg_observability.py
      continue-on-error: true

    - name: Generate test report
      if: always()
      run: |
        echo "## Memory System Test Report" > test_report.md
        echo "- Python Version: ${{ matrix.python-version }}" >> test_report.md
        echo "- Branch: ${{ github.ref }}" >> test_report.md
        echo "- Commit: ${{ github.sha }}" >> test_report.md

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          *.json
          *.log
          test_report.md
