[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmam"
version = "1.0.0"
description = "Brain-inspired Multi-Agent Memory Framework - A neuroscience-inspired cognitive architecture with 12 specialized agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Brain-Inspired AI Team"}
]
keywords = [
    "memory", "cognitive-architecture", "multi-agent",
    "brain-inspired", "llm", "conversational-ai",
    "hippocampus", "episodic-memory", "semantic-memory"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "aiohttp>=3.8.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black",
    "isort",
    "mypy",
]
voice = [
    "sounddevice>=0.4.0",
    "soundfile>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/brain-inspired-ai/bmam"
Documentation = "https://github.com/brain-inspired-ai/bmam#readme"
Repository = "https://github.com/brain-inspired-ai/bmam.git"
Issues = "https://github.com/brain-inspired-ai/bmam/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
