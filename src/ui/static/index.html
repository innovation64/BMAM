<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' data: blob:; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cubism.live2d.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' ws://localhost:8080 http://localhost:8080 https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;">
    <title>BMAM Voice Anime UI - Yaoguang (摇光明明)</title>
    <link rel="stylesheet" href="/static/character.css">

    <!-- Live2D Dependencies -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
    <script src="/static/live2d-viewer.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #character-container {
            position: absolute;
            left: 35%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 600px;
            z-index: 10;
        }

        #live2d-canvas {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: transparent;
        }

        .character-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #memory-panel {
            position: absolute;
            right: 5%;
            top: 10%;
            width: 35%;
            height: 80%;
            background: rgba(30, 30, 50, 0.85);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(107, 70, 193, 0.3);
            overflow-y: auto;
        }

        .memory-item {
            background: rgba(107, 70, 193, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #6B46C1;
            transition: all 0.3s ease;
        }

        .memory-item:hover {
            background: rgba(107, 70, 193, 0.2);
            transform: translateX(5px);
        }

        #chat-bubble {
            position: absolute;
            left: 35%;
            top: 25%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #1A1A2E;
            padding: 15px 20px;
            border-radius: 20px;
            max-width: 300px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            display: none;
        }

        #waveform {
            position: absolute;
            left: 35%;
            bottom: 15%;
            transform: translateX(-50%);
            width: 300px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .wave-bar {
            width: 6px;
            background: linear-gradient(to top, #00D9FF, #6B46C1);
            border-radius: 3px;
            transition: height 0.1s ease;
        }

        #control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #6B46C1, #FF6B9D);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 70, 193, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .listening {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="character-container">
            <canvas id="live2d-canvas" style="display: block;"></canvas>

            <!-- Always-visible animated fallback character (kanban-musume mascot) -->
            <div id="character" class="mascot-avatar" aria-label="看板娘风格的摇光明明" style="display: none;">
                <div class="mascot-base-glow"></div>

                <div class="mascot-character">
                    <div class="mascot-hair-back"></div>

                    <div class="mascot-head">
                        <div class="mascot-hair-top"></div>
                        <div class="mascot-face">
                            <div class="mascot-eye left">
                                <span class="mascot-eye-highlight"></span>
                                <span class="mascot-eye-highlight mini"></span>
                            </div>
                            <div class="mascot-eye right">
                                <span class="mascot-eye-highlight"></span>
                                <span class="mascot-eye-highlight mini"></span>
                            </div>
                            <div class="mascot-mouth"></div>
                            <div class="mascot-blush left"></div>
                            <div class="mascot-blush right"></div>
                        </div>
                        <div class="mascot-hair-side left"></div>
                        <div class="mascot-hair-side right"></div>
                        <div class="mascot-hair-tail left"></div>
                        <div class="mascot-hair-tail right"></div>
                    </div>

                    <div class="mascot-body">
                        <div class="mascot-collar"></div>
                        <div class="mascot-ribbon">
                            <div class="mascot-ribbon-left"></div>
                            <div class="mascot-ribbon-right"></div>
                            <div class="mascot-ribbon-center"></div>
                        </div>
                        <div class="mascot-torso"></div>
                        <div class="mascot-skirt"></div>
                    </div>

                    <div class="mascot-arm left">
                        <div class="mascot-sleeve"></div>
                        <div class="mascot-hand"></div>
                    </div>
                    <div class="mascot-arm right">
                        <div class="mascot-sleeve"></div>
                        <div class="mascot-hand"></div>
                    </div>

                    <div class="mascot-leg left">
                        <div class="mascot-sock"></div>
                        <div class="mascot-shoe"></div>
                    </div>
                    <div class="mascot-leg right">
                        <div class="mascot-sock"></div>
                        <div class="mascot-shoe"></div>
                    </div>
                </div>

                <div class="mascot-board">
                    <div class="board-frame">
                        <div class="board-header">BMAM 看板</div>
                        <div class="board-body">
                            <div class="board-line long"></div>
                            <div class="board-line"></div>
                            <div class="board-line short"></div>
                        </div>
                    </div>
                    <div class="board-shadow"></div>
                </div>

                <div class="mascot-sparkle sparkle-1"></div>
                <div class="mascot-sparkle sparkle-2"></div>
                <div class="mascot-sparkle sparkle-3"></div>
                <div class="mascot-shadow"></div>
            </div>

            <div class="character-overlay">
                <div class="emotion-particles"></div>
                <div class="character-nametag">摇光明明 (Yaoguang)</div>
            </div>
        </div>

        <div id="memory-panel">
            <h3 style="margin-bottom: 20px; color: #00D9FF;">BMAM Memory System</h3>
            <div style="font-size: 12px; color: #888; margin-bottom: 15px;">
                Retrieved Memories & Context
            </div>
            <div id="memory-list"></div>
        </div>

        <div id="chat-bubble">
            <span id="chat-text"></span>
        </div>

        <div id="waveform">
            <!-- Wave bars will be generated by JavaScript -->
        </div>

        <div id="control-panel">
            <button id="listen-btn">🎤 Start Listening</button>
            <button id="clear-btn">🗑️ Clear</button>
            <button id="settings-btn">⚙️ Settings</button>
        </div>
    </div>

    <script src="/static/ui-controller.js"></script>
</body>
</html>
