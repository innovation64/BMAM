<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMAM Voice Anime UI - Yaoguang</title>
    <link rel="stylesheet" href="/static/unified_theme.css?v=5">
    <link rel="stylesheet" href="/static/character.css">

    <!-- Live2D Dependencies -->
    <script src="/static/js/lib/live2dcubismcore.min.js"></script>
    <script src="/static/js/live2dv3.js"></script>
    <script src="/static/live2d-viewer-v3.js"></script>
</head>
<body>
    <nav class="main-nav">
        <div class="nav-brand">
            <span>&#x1f9e0;</span> <span data-i18n="brand">BMAM Soul</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-item active" data-i18n="nav.voice">Voice</a>
            <a href="/static/text_ui.html" class="nav-item" data-i18n="nav.text">Text</a>
            <a href="/static/monitor.html" class="nav-item" data-i18n="nav.monitor">Monitor</a>
        </div>
        <button id="lang-toggle">EN / ZH</button>
    </nav>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Sidebar toggle -->
    <button id="sidebar-toggle" title="Toggle sidebar">&#x25C0;</button>

    <div id="app">
        <!-- ── Main stage ──────────────────────────────────────────────── -->
        <div id="main-stage">
            <div id="character-stage">
                <div id="character-container">
                    <div id="live2d-canvas"></div>

                    <!-- Fallback character (hidden by default) -->
                    <div id="character" class="mascot-avatar" aria-label="Yaoguang" style="display: none;">
                        <div class="mascot-base-glow"></div>
                        <div class="mascot-character">
                            <div class="mascot-hair-back"></div>
                            <div class="mascot-head">
                                <div class="mascot-hair-top"></div>
                                <div class="mascot-face">
                                    <div class="mascot-eye left">
                                        <span class="mascot-eye-highlight"></span>
                                        <span class="mascot-eye-highlight mini"></span>
                                    </div>
                                    <div class="mascot-eye right">
                                        <span class="mascot-eye-highlight"></span>
                                        <span class="mascot-eye-highlight mini"></span>
                                    </div>
                                    <div class="mascot-mouth"></div>
                                    <div class="mascot-blush left"></div>
                                    <div class="mascot-blush right"></div>
                                </div>
                                <div class="mascot-hair-side left"></div>
                                <div class="mascot-hair-side right"></div>
                                <div class="mascot-hair-tail left"></div>
                                <div class="mascot-hair-tail right"></div>
                            </div>
                            <div class="mascot-body">
                                <div class="mascot-collar"></div>
                                <div class="mascot-ribbon">
                                    <div class="mascot-ribbon-left"></div>
                                    <div class="mascot-ribbon-right"></div>
                                    <div class="mascot-ribbon-center"></div>
                                </div>
                                <div class="mascot-torso"></div>
                                <div class="mascot-skirt"></div>
                            </div>
                            <div class="mascot-arm left">
                                <div class="mascot-sleeve"></div>
                                <div class="mascot-hand"></div>
                            </div>
                            <div class="mascot-arm right">
                                <div class="mascot-sleeve"></div>
                                <div class="mascot-hand"></div>
                            </div>
                            <div class="mascot-leg left">
                                <div class="mascot-sock"></div>
                                <div class="mascot-shoe"></div>
                            </div>
                            <div class="mascot-leg right">
                                <div class="mascot-sock"></div>
                                <div class="mascot-shoe"></div>
                            </div>
                        </div>
                        <div class="mascot-board">
                            <div class="board-frame">
                                <div class="board-header">BMAM</div>
                                <div class="board-body">
                                    <div class="board-line long"></div>
                                    <div class="board-line"></div>
                                    <div class="board-line short"></div>
                                </div>
                            </div>
                            <div class="board-shadow"></div>
                        </div>
                        <div class="mascot-sparkle sparkle-1"></div>
                        <div class="mascot-sparkle sparkle-2"></div>
                        <div class="mascot-sparkle sparkle-3"></div>
                        <div class="mascot-shadow"></div>
                    </div>

                    <div class="character-overlay">
                        <div class="emotion-particles"></div>
                        <div class="character-nametag">Yaoguang</div>
                    </div>
                </div>

                <!-- Chat bubble overlay (animation-driven) -->
                <div id="chat-bubble">
                    <span id="chat-text"></span>
                </div>
            </div>

            <!-- Waveform + mic -->
            <div id="waveform"></div>
            <button id="mic-button" title="Push to talk" data-i18n="mic.click_to_speak">&#x1F3A4;</button>

            <!-- Chat history + text input -->
            <div id="chat-panel">
                <div id="chat-history"></div>
                <div id="chat-input-bar">
                    <input type="text" id="chat-input" data-i18n="chat.input_placeholder" data-i18n-attr="placeholder" placeholder="Type a message..." autocomplete="off">
                    <button id="chat-send-btn" data-i18n="chat.send">Send</button>
                </div>
            </div>

            <!-- Small control buttons (bottom-left) -->
            <div id="control-panel">
                <button id="clear-btn">Clear</button>
                <button id="settings-btn">Debug</button>
            </div>

            <!-- Audio debug panel -->
            <div id="audio-debug">
                <div style="color: var(--accent); margin-bottom: 10px; font-weight: bold;">Audio Debug</div>
                <div>Status: <span id="debug-status">Idle</span></div>
                <div>Amplitude: <span id="debug-amplitude">0%</span></div>
                <div>Microphone: <span id="debug-mic">Not initialized</span></div>
                <div style="margin-top: 10px;">
                    <div style="width: 200px; height: 10px; background: #333; border-radius: 5px; overflow: hidden;">
                        <div id="debug-meter" style="width: 0%; height: 100%; background: linear-gradient(to right, var(--accent), var(--primary)); transition: width 0.1s;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Sidebar ─────────────────────────────────────────────────── -->
        <div id="sidebar">
            <div class="sidebar-section">
                <h3 data-i18n="sidebar.brain_regions">Brain Regions</h3>
                <div id="brain-regions"></div>
            </div>

            <div class="sidebar-section">
                <h3 data-i18n="sidebar.reasoning_trace">Reasoning Trace</h3>
                <div id="reasoning-steps">
                    <div style="color: #888; font-style: italic;" data-i18n="right.no_reasoning">No active reasoning...</div>
                </div>
            </div>

            <div class="sidebar-section">
                <h3 data-i18n="sidebar.memories_title">Retrieved Memories</h3>
                <div id="memory-list"></div>
            </div>
        </div>
    </div>

    <!-- Scripts: i18n first, then brain-viz, then app -->
    <script src="/static/i18n.js"></script>
    <script src="/static/brain-viz.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
