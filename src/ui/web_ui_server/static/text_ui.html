<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMAM Soul - Text Chat</title>
    <link rel="stylesheet" href="/static/unified_theme.css?v=4">
    <style>
        .chat-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            height: 100%;
            gap: 20px;
            padding: 20px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-main {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Message Bubbles */
        .message-row {
            display: flex;
            gap: 16px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .avatar.system {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            box-shadow: 0 4px 12px rgba(0, 230, 255, 0.3);
        }

        .avatar.user {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message-content {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
        }

        .message-row.system .message-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top-left-radius: 4px;
            color: var(--text-main);
        }

        .message-row.user .message-content {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-top-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(125, 95, 255, 0.3);
        }

        /* Input Area */
        .input-wrapper {
            padding: 20px;
            background: rgba(15, 15, 26, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 10px;
        }

        .input-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            resize: none;
            height: 24px;
            max-height: 100px;
            outline: none;
            font-family: inherit;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: var(--secondary);
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sidebar-section {
            margin-bottom: 24px;
        }

        .sidebar-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <nav class="main-nav">
        <div class="nav-brand">
            <span>🧠</span> BMAM Soul
        </div>
        <div class="nav-links">
            <a href="/" class="nav-item">Voice</a>
            <a href="/static/text_ui.html" class="nav-item active">Text</a>
            <a href="/static/monitor.html" class="nav-item">Monitor</a>
        </div>
    </nav>

    <div class="app-container">
        <div class="chat-layout">
            <!-- Sidebar -->
            <div class="glass-panel sidebar" style="padding: 20px;">
                <div class="sidebar-section">
                    <div class="sidebar-title">Memory Management</div>
                    <button id="export-btn" class="action-btn">
                        <span>⬇️</span> Export Brain Package
                    </button>
                    <button id="import-btn" class="action-btn">
                        <span>⬆️</span> Import Brain Package
                    </button>
                    <input type="file" id="file-input" style="display: none" accept=".json">
                </div>

                <div class="sidebar-section" style="flex: 1;">
                    <div class="sidebar-title">Active Context</div>
                    <div id="context-list" style="font-size: 13px; color: var(--text-muted);">
                        No active context...
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="glass-panel chat-main">
                <div id="chat-history" class="chat-history">
                    <div class="message-row system">
                        <div class="avatar system">🧠</div>
                        <div class="message-content">
                            Hello! I am <strong>Yaoguang</strong>. I'm ready to chat.
                        </div>
                    </div>
                </div>

                <div class="input-wrapper">
                    <div class="input-box">
                        <textarea id="user-input" placeholder="Type a message..."></textarea>
                    </div>
                    <button id="send-btn" class="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/text-ui-controller.js?v=4"></script>
    <script>
        const textarea = document.getElementById('user-input');
        textarea.addEventListener('input', function () {
            this.style.height = '24px';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>

</html>
