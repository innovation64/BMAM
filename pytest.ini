[pytest]
# 测试目录配置
testpaths = tests

# 排除废弃测试和使用旧架构的基准测试
ignore =
    tests/deprecated
    tests/benchmarks

# Python文件发现模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 显示选项
addopts = -v --tb=short

# 异步测试支持
asyncio_mode = auto

# 标记定义
markers =
    slow: 标记为慢速测试
    integration: 集成测试
    benchmark: 基准测试（需显式启用）
