      aliases: ['employed by', 'works at']
    - name: 'knows'
      aliases: ['acquainted with', 'familiar with']
    - name: 'likes'
      aliases: ['enjoys', 'prefers']
    - name: 'visited'
      aliases: ['went to', 'traveled to']
