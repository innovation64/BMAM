    - name: 'february'
      aliases: ['feb']
      number: 2
    - name: 'march'
      aliases: ['mar']
      number: 3
    - name: 'april'
      aliases: ['apr']
      number: 4
    - name: 'may'
      aliases: []
      number: 5
